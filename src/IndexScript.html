<script>
let STANDARD_OPTIONS=[];   // apiGetStandardOptions()
let FAVORITE_VENUES=[];    // apiGetFavoriteVenues()
let HEARING=[];            // apiGetFormSchema()（会場非依存・単一マスタ）
let STAFF_TEMPLATE='';     // apiGetStaffTemplate()
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const CAT_PALETTE=['#2563eb','#db2777','#059669','#d97706','#7c3aed','#0891b2','#be123c','#4d7c0f'];
function catColor(idx){return CAT_PALETTE[idx%CAT_PALETTE.length];}
let state={blocks:[{id:1,venueName:'',venueAddress:'',snap:null}],active:1,seq:1};
let currentCaseId=null;
// アップロード画像(layoutImgs)はデータ量が大きく、スプレッドシートのセル文字数上限に
// 抵触しうるため、案件データとしての保存対象からは除外する（利用確認書PDFへの反映のみ）。
function blocksForSave_(){return state.blocks.map(b=>{const c=Object.assign({},b);delete c.layoutImgs;return c;});}
function startNewCase(){
  if(!confirm('現在の入力内容を破棄して新規案件を開始します。よろしいですか？'))return;
  currentCaseId=null;
  state={blocks:[{id:1,venueName:'',venueAddress:'',snap:null}],active:1,seq:1};
  const status=document.getElementById('saveCaseStatus');
  if(status)status.textContent='新規案件を開始しました';
  renderAll();
}
// METAの必須項目が未入力の状態での保存を防ぐ(案件を特定するための情報が
// 欠けたまま保存されるのを避けるため)。予約管理番号は任意項目のため対象外。
const META_OPTIONAL_ITEMS_=['予約管理URL','予約管理番号'];
function metaMissingFields_(){
  const sec=HEARING.find(s=>s.cat==='META');
  if(!sec)return [];
  return sec.items.filter(it=>META_OPTIONAL_ITEMS_.indexOf(it.item)===-1&&!q(it.item)).map(it=>it.item);
}
function saveCurrentCase(){
  const missing=metaMissingFields_();
  if(missing.length){alert('①ヒアリングシートのMETA区分が未入力のため保存できません。\n未入力項目: '+missing.join('、'));return;}
  snapshot();
  const b=activeBlock();
  const payload={caseId:currentCaseId,venueName:b.venueName||'',venueAddress:b.venueAddress||'',company:q('会社名'),client:q('担当者'),blocks:blocksForSave_()};
  const status=document.getElementById('saveCaseStatus');
  if(status)status.textContent='保存中…';
  google.script.run.withSuccessHandler(function(r){
    let res={};try{res=JSON.parse(r);}catch(e){}
    if(res.caseId)currentCaseId=res.caseId;
    if(status)status.textContent='保存しました（'+(res.savedAt||'')+'）';
  }).withFailureHandler(function(err){
    if(status)status.textContent='保存エラー: '+err;
  }).saveCase(JSON.stringify(payload));
}
let loadCaseData=[];
function openLoadCaseModal(){
  document.getElementById('loadCaseModal').style.display='flex';
  document.getElementById('loadCaseSearch').value='';
  document.getElementById('loadCaseList').innerHTML='読み込み中…';
  google.script.run.withSuccessHandler(function(r){
    try{loadCaseData=JSON.parse(r)||[];}catch(e){loadCaseData=[];}
    renderLoadCaseList();
  }).withFailureHandler(function(err){
    document.getElementById('loadCaseList').innerHTML='取得エラー: '+esc(String(err));
  }).listCases();
}
function closeLoadCaseModal(){document.getElementById('loadCaseModal').style.display='none';}
function renderLoadCaseList(){
  const kw=(document.getElementById('loadCaseSearch').value||'').toLowerCase();
  const filtered=loadCaseData.filter(c=>!kw||[c.company,c.client,c.venueName].some(s=>(s||'').toLowerCase().includes(kw)));
  const host=document.getElementById('loadCaseList');
  if(!filtered.length){host.innerHTML='<div style="color:#64748b;padding:10px">'+(loadCaseData.length?'該当する案件がありません':'保存済みの案件がまだありません')+'</div>';return;}
  host.innerHTML=filtered.map(c=>`<div style="display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid #1e293b">
    <div onclick="loadCaseById('${esc(c.caseId)}')" style="flex:1;cursor:pointer">
      <div style="color:#e2e8f0;font-weight:600">${esc(c.company||'(会社名未入力)')}${c.client?'　／　'+esc(c.client):''}</div>
      <div style="color:#94a3b8;font-size:12px">${esc(c.venueName||'(会場未入力)')}　更新: ${esc(c.updatedAt||'')}${c.updatedBy?'（'+esc(c.updatedBy)+'）':''}</div>
    </div>
    <button type="button" onclick="event.stopPropagation();deleteCaseById('${esc(c.caseId)}')" title="この案件を削除" style="background:none;border:none;color:#fca5a5;cursor:pointer;font-size:16px;padding:4px">🗑</button>
  </div>`).join('');
}
function deleteCaseById(caseId){
  if(!confirm('この案件データを完全に削除します。元に戻せません。よろしいですか？'))return;
  google.script.run.withSuccessHandler(function(){
    loadCaseData=loadCaseData.filter(c=>c.caseId!==caseId);
    renderLoadCaseList();
  }).withFailureHandler(function(err){
    alert('削除エラー: '+err);
  }).deleteCase(caseId);
}
function loadCaseById(caseId){
  closeLoadCaseModal();
  const status=document.getElementById('saveCaseStatus');
  if(status)status.textContent='読み込み中…';
  google.script.run.withSuccessHandler(function(r){
    let res={};try{res=JSON.parse(r);}catch(e){}
    if(res.error){if(status)status.textContent='読み込みエラー: '+res.error;return;}
    currentCaseId=res.caseId;
    const blocks=(res.blocks&&res.blocks.length)?res.blocks:[{id:1,venueName:res.venueName||'',venueAddress:res.venueAddress||'',snap:null}];
    let maxId=0; blocks.forEach(b=>{if(b.id>maxId)maxId=b.id;});
    state={blocks:blocks,active:blocks[0].id,seq:maxId};
    renderAll();
    if(status)status.textContent='読み込みました（'+(res.updatedAt||'')+'）';
  }).withFailureHandler(function(err){
    if(status)status.textContent='読み込みエラー: '+err;
  }).loadCase(caseId);
}
function showCaseUrl(url){
  let box=document.getElementById('caseUrlBox');
  if(!box){
    box=document.createElement('div');
    box.id='caseUrlBox';
    box.className='case-url-box';
    const inp=document.createElement('input');
    inp.readOnly=true;
    inp.onclick=function(){this.select();};
    const closeBtn=document.createElement('button');
    closeBtn.textContent='×';
    closeBtn.onclick=function(){box.style.display='none';};
    box.appendChild(inp); box.appendChild(closeBtn);
    document.body.appendChild(box);
  }
  box.style.display='flex';
  const inp=box.querySelector('input');
  inp.value=url; inp.select();
  try{document.execCommand('copy');}catch(e){}
}
// Apps ScriptのHtmlServiceはページ本体をscript.googleusercontent.comの
// 内部iframeで配信するため、location.origin/pathnameはそのiframe自身のURLを指してしまい、
// 実際にアドレスバーに表示されている（共有可能な）URLとは異なる。そのため固定値を使う。
// ※実際のデプロイ後、OptionMaster.gsのWEBAPP_BASE_URLと同じ値に必ず更新すること。
const WEBAPP_BASE_URL='https://script.google.com/a/macros/adval.jp/s/AKfycbxPRYx_2qBpq5OTJL7x8iZcseYcjp38jbNGDpxaV5CVjU_q_EhQGAVZzAP2LnfMId_Jig/exec';
function outputCaseUrl(){
  const status=document.getElementById('saveCaseStatus');
  const emit=()=>{
    const url=WEBAPP_BASE_URL+'?case='+encodeURIComponent(currentCaseId);
    showCaseUrl(url);
    if(status)status.textContent='URLをコピーしました';
  };
  if(currentCaseId){emit();return;}
  const missing=metaMissingFields_();
  if(missing.length){alert('①ヒアリングシートのMETA区分が未入力のため保存できません。\n未入力項目: '+missing.join('、'));return;}
  snapshot();
  const b=activeBlock();
  const payload={caseId:null,venueName:b.venueName||'',venueAddress:b.venueAddress||'',company:q('会社名'),client:q('担当者'),blocks:blocksForSave_()};
  if(status)status.textContent='保存してURLを発行中…';
  google.script.run.withSuccessHandler(function(r){
    let res={};try{res=JSON.parse(r);}catch(e){}
    if(res.caseId)currentCaseId=res.caseId;
    emit();
  }).withFailureHandler(function(err){
    if(status)status.textContent='保存エラー: '+err;
  }).saveCase(JSON.stringify(payload));
}
function activeBlock(){return state.blocks.find(b=>b.id===state.active);}
function ctl(it){
  const t=it.type,val=it.value||'',di='data-item="'+esc(it.item)+'"';
  if(t==='select'){
    const opts=it.options||[];
    const hasOther=opts.indexOf('その他')>-1;
    let selVal=val,otherVal='';
    const om=/^その他（(.*)）$/.exec(val);
    if(om){selVal='その他';otherVal=om[1];}
    const o=opts.map(op=>`<option ${op===selVal?'selected':''}>${esc(op)}</option>`).join('');
    let html=`<select ${di}><option value="">選択</option>${o}</select>`;
    if(hasOther)html+=`<input type="text" class="other-input" style="margin-left:6px;display:${selVal==='その他'?'inline-block':'none'}" placeholder="その他の内容" value="${esc(otherVal)}">`;
    return html;
  }
  if(t==='date')return `<input ${di} type="date" value="${esc(val)}">`;
  if(t==='datetime')return `<input ${di} type="text" value="${esc(val)}" style="min-width:200px" placeholder="YYYY-MM-DDTHH:MM">`;
  if(t==='timerange'){let a='',b='';if(val&&val.indexOf('～')>-1){const p=val.split('～');a=p[0];b=p[1];}return `<div class="timerange" ${di}><input type="time" value="${a}"> 〜 <input type="time" value="${b}"></div>`;}
  if(t==='textarea')return `<textarea ${di}>${esc(val)}</textarea>`;
  return `<input ${di} type="text" value="${esc(val)}" placeholder="入力">`;
}
function getEl(item){const host=document.getElementById('hearing');if(!host)return null;return [...host.querySelectorAll('[data-item]')].find(e=>e.getAttribute('data-item')===item);}
function readCtl(el){
  if(el.classList&&el.classList.contains('timerange')){const t=el.querySelectorAll('input[type=time]');const a=t[0].value,b=t[1].value;return (a||b)?(a+'～'+b):'';}
  let v=el.value||'';
  if(el.tagName==='SELECT'&&v==='その他'){
    const fl=el.closest('.field');const ot=fl?fl.querySelector('.other-input'):null;
    if(ot&&ot.value.trim())v='その他（'+ot.value.trim()+'）';
  }
  return v;
}
function writeCtl(el,v){
  if(el.classList&&el.classList.contains('timerange')){const t=el.querySelectorAll('input[type=time]');if(v&&v.indexOf('～')>-1){const p=v.split('～');t[0].value=p[0];t[1].value=p[1];}else{t[0].value='';t[1].value='';}return;}
  if(el.tagName==='SELECT'){
    const m=/^その他（(.*)）$/.exec(String(v));
    const fl=el.closest('.field');const ot=fl?fl.querySelector('.other-input'):null;
    if(m){el.value='その他';if(ot){ot.value=m[1];ot.style.display='inline-block';}}
    else{el.value=v;if(ot)ot.style.display=(v==='その他')?'inline-block':'none';}
    el.dispatchEvent(new Event('change'));
    return;
  }
  el.value=v;
}
function snapshot(){
  const b=activeBlock();
  if(!document.querySelector('#hearing [data-item]'))return;
  const vals={},memos={};
  document.querySelectorAll('#hearing [data-item]').forEach(el=>{
    const it=el.getAttribute('data-item');
    vals[it]=readCtl(el);
    const fl=el.closest('.field');
    const mm=fl?fl.querySelector('.memo'):null;
    memos[it]=mm?mm.value:'';
  });
  b.snap={vals,memos};
}
function blankSnap(){const vals={},memos={};HEARING.forEach(s=>s.items.forEach(it=>{vals[it.item]='';memos[it.item]='';}));return {vals,memos};}
function restore(snap){
  if(!snap)return;
  Object.keys(snap.vals).forEach(it=>{const el=getEl(it);if(el)writeCtl(el,snap.vals[it]);});
  Object.keys(snap.memos||{}).forEach(it=>{const el=getEl(it);if(el){const mm=el.closest('.field').querySelector('.memo');if(mm)mm.value=snap.memos[it];}});
}
function renderVenueBar(){
  const b=activeBlock();
  const chips=state.blocks.map(bl=>`<span class="chip ${bl.id===state.active?'active':''}" onclick="switchBlock(${bl.id})">${esc(bl.venueName||'(会場未入力)')}${state.blocks.length>1?` <button onclick="event.stopPropagation();removeBlock(${bl.id})">×</button>`:''}</span>`).join('');
  const dl=FAVORITE_VENUES.map(v=>`<option value="${esc(v.name)}">`).join('');
  // 「登録済みの会場からどう選ぶのか分かりにくい」という声を受け、会場名欄への
  // 入力補完(datalist)に加えて、はっきり見える選択式(select)も併設する。
  const favOptions=FAVORITE_VENUES.map(v=>`<option value="${esc(v.name)}">${esc(v.name)}</option>`).join('');
  document.getElementById('vbar').innerHTML=`<label>検討中の会場/日程</label>${chips}
    <button class="addbtn" onclick="addBlock()">＋会場/日程を追加（複数検討）</button>
    <span style="margin-left:auto"></span>
    <label>会場名</label><input id="venueNameInput" type="text" list="favoriteVenueList" value="${esc(b.venueName||'')}" placeholder="会場名を入力（自由記述）" style="min-width:200px">
    <datalist id="favoriteVenueList">${dl}</datalist>
    <select id="favoriteVenueSelect" title="登録済みの会場から選ぶ" style="min-width:170px"><option value="">▼ 登録済み会場から選ぶ（${FAVORITE_VENUES.length}件）</option>${favOptions}</select>
    <label>会場住所</label><input id="venueAddressInput" type="text" value="${esc(b.venueAddress||'')}" placeholder="会場住所（自由記述）" style="min-width:220px">
    <button class="addbtn" style="background:#7c3aed" onclick="registerFavoriteVenue()">＋この会場を登録</button>`;
  const vn=document.getElementById('venueNameInput');
  const va=document.getElementById('venueAddressInput');
  const fvs=document.getElementById('favoriteVenueSelect');
  const applyVenuePick_=name=>{
    vn.value=name;activeBlock().venueName=name;
    const hit=FAVORITE_VENUES.find(v=>v.name===name);
    if(hit&&!va.value.trim()){va.value=hit.address;activeBlock().venueAddress=hit.address;}
    syncMetaVenueLine_();
  };
  vn.oninput=()=>{activeBlock().venueName=vn.value;syncMetaVenueLine_();};
  vn.onchange=()=>{
    // datalist(よく使う会場)から選択された場合、住所が未入力なら自動補完する
    const hit=FAVORITE_VENUES.find(v=>v.name===vn.value);
    if(hit&&!va.value.trim()){va.value=hit.address;activeBlock().venueAddress=hit.address;}
  };
  fvs.onchange=()=>{if(fvs.value){applyVenuePick_(fvs.value);fvs.value='';}};
  va.oninput=()=>{activeBlock().venueAddress=va.value;};
}
// ①ヒアリングシート「META」区分内に会場名を表示する行があれば、最新の会場名に同期する。
function syncMetaVenueLine_(){
  const el=document.getElementById('metaVenueLine');
  if(el)el.textContent=activeBlock().venueName||'(会場未入力)';
}
function registerFavoriteVenue(){
  const name=(document.getElementById('venueNameInput').value||'').trim();
  const address=(document.getElementById('venueAddressInput').value||'').trim();
  if(!name){alert('会場名を入力してください');return;}
  if(!confirm('「よく使う会場」に登録します。\n会場名: '+name+'\n住所: '+(address||'(未入力)')+'\n\nよろしいですか？'))return;
  google.script.run.withSuccessHandler(function(r){
    let res={};try{res=JSON.parse(r);}catch(e){}
    if(res&&res.error){alert('登録エラー: '+res.error);return;}
    alert(res&&res.updated?'既存の会場情報を更新しました。':'登録しました。');
    loadFavoriteVenues_(function(){renderVenueBar();});
  }).withFailureHandler(function(err){alert('登録エラー: '+err);}).addFavoriteVenue(name,address);
}
function loadFavoriteVenues_(cb){
  if(typeof google!=='undefined'&&google.script&&google.script.run){
    google.script.run.withSuccessHandler(function(j){try{FAVORITE_VENUES=JSON.parse(j)||[];}catch(e){FAVORITE_VENUES=[];}cb&&cb();})
      .withFailureHandler(function(err){console.warn('よく使う会場取得失敗',err);FAVORITE_VENUES=[];cb&&cb();})
      .apiGetFavoriteVenues();
  }else{cb&&cb();}
}
function switchBlock(id){snapshot();state.active=id;renderAll();}
function addBlock(){snapshot();state.seq++;const cur=activeBlock();const nb={id:state.seq,venueName:cur.venueName||'',venueAddress:cur.venueAddress||'',snap:blankSnap()};state.blocks.push(nb);state.active=nb.id;renderAll();}
function removeBlock(id){if(state.blocks.length<=1)return;state.blocks=state.blocks.filter(b=>b.id!==id);if(state.active===id)state.active=state.blocks[0].id;renderAll();}
const RAKU_NOTE={'フル':'現場復帰・ゴミ回収あり','ライト':'現場復帰(15分程度)・ゴミ回収(1袋目安)','なし':''};
function renderHearing(){
  const host=document.getElementById('hearing');
  const b=activeBlock();
  let html=`<div class="tools">
    <details open><summary>📄 テキスト出力</summary>
      <div><button class="toolbtn" onclick="doExport()">📝 テキスト出力を生成</button>
      <button class="toolbtn sec" onclick="doExportTmpl('houkoku')">📣 成約報告</button>
      <button class="toolbtn sec" onclick="doExportTmpl('isshukan')">🗓️ 1週間前共有</button>
      <button class="toolbtn sec" onclick="doExportTmpl('zenjitsu')">📌 前日共有</button>
      <button class="toolbtn sec" onclick="copyOut()">コピー</button></div>
      <textarea id="outText" readonly placeholder="「テキスト出力を生成」を押すと表示されます"></textarea></details></div>
  <div class="banner" id="cateringBanner"></div>`;
  if(!HEARING.length){
    html+='<div class="banner">ヒアリング項目マスタが未取得、または項目が0件です。「ヒアリング項目マスタ」スプレッドシートを確認してください。</div>';
  }
  HEARING.forEach((sec,secIdx)=>{
    const rows=sec.items.map(it=>{
      const rowcls='row'+(it.catering?' catering-detail':'');
      const memo=(it.memo||'').split('\n')[0];
      return `<div class="${rowcls}"><div class="lbl">${esc(it.item)}</div>
        <div class="field"><div class="ctl">${ctl(it)}</div>
        <input class="memo" type="text" value="${esc(memo)}" placeholder="備考メモ (任意)"></div></div>`;
    }).join('');
    // METAカテゴリ(顧客情報)には、上部の会場バーで入力した会場名を常に表示し、
    // どの案件の顧客情報かを一目で分かるようにする(vbarのinputと連動、syncMetaVenueLine_参照)。
    const metaVenueRow=(sec.cat==='META')?`<div class="row" style="border-bottom:1.5px solid #334155"><div class="lbl">会場（①上部の会場バーから入力）</div>
      <div class="field"><div class="ctl" style="font-weight:800;color:#fff" id="metaVenueLine">${esc(b.venueName||'(会場未入力)')}</div></div></div>`:'';
    html+=`<div class="cat"><div class="head" style="background:${catColor(secIdx)}" data-toggle>
      <span>${esc(sec.cat)}</span><span class="count">（${sec.items.length}項目）</span><span class="chev">▾</span></div>
      <div class="body">${metaVenueRow}${rows}
      <div class="row" style="border:none"><div class="lbl">セクションメモ</div><div class="field"><textarea class="memo" placeholder="このセクション共通の補足メモ…"></textarea></div></div></div></div>`;
  });
  html+=`<div class="cat"><div class="head" style="background:${catColor(HEARING.length)}" data-toggle>
    <span>会場固有オプション</span><span class="count" id="hearingFreeCount">（0件）</span><span class="chev">▾</span></div>
    <div class="body">
      <div style="font-size:11px;color:#94a3b8;margin-bottom:8px">この会場特有のオプション(設備・サービス等)を品目名で登録し、今回の案件で提供する場合は「あり」にしてください。「あり」の項目だけ③利用確認書に追加され、単価・数量を入力できます。</div>
      <table class="fee"><thead><tr><th>品目名</th><th style="width:110px">今回</th><th style="width:26px"></th></tr></thead><tbody id="hearingFreeTbody"></tbody></table>
      <button type="button" class="toolbtn sec" onclick="addFreeFeeRowFromHearing()" style="margin-top:8px">＋ 品目を追加</button>
    </div></div>`;
  host.innerHTML=html;
  host.querySelectorAll('[data-toggle]').forEach(h=>h.onclick=()=>h.closest('.cat').classList.toggle('collapsed'));
  host.querySelectorAll('select[data-item]').forEach(sel=>{
    const fl=sel.closest('.field');const ot=fl?fl.querySelector('.other-input'):null;
    if(ot)sel.addEventListener('change',()=>{ot.style.display=(sel.value==='その他')?'inline-block':'none';});
  });
  const c=getEl('ケータリング区分'); if(c)c.addEventListener('change',applyCatering);
  const stEl=getEl('ステータス'); if(stEl)stEl.addEventListener('change',updateStatusPill);
  const rk=getEl('ラクラクパック'); if(rk)rk.addEventListener('change',()=>{const mm=rk.closest('.field').querySelector('.memo'); if(mm&&RAKU_NOTE[rk.value]!==undefined)mm.value=RAKU_NOTE[rk.value];});
  restore(b.snap);
  applyCatering();
  updateStatusPill();
  renderHearingFreeOptions_();
}
const STATUS_COLOR={'問合せ':'#0ea5e9','仮予約':'#d97706','本予約':'#f43f5e','失注':'#64748b','見積確定':'#8b5cf6'};
function updateStatusPill(){
  const pill=document.getElementById('statusPill'); if(!pill)return;
  const v=q('ステータス');
  const color=STATUS_COLOR[v]||'#64748b';
  pill.textContent=v||'ステータス未設定';
  pill.style.background=color+'33'; pill.style.color=color; pill.style.borderColor=color;
}
// 「ケータリング関連フラグ」が立っている項目行は、ケータリング区分(あれば)が
// 「なし」のときだけ非表示にする（会場マスタ非依存の汎用ロジック。項目自体が
// 存在しない場合は何もしない＝常に表示のままとするフェイルセーフ）。

const WEEKDAY_JP_=['日','月','火','水','木','金','土'];
function formatDateJp_(iso){
  if(!iso)return '';
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if(!m)return iso;
  const d=new Date(+m[1],+m[2]-1,+m[3]);
  return m[1]+'年'+(+m[2])+'月'+(+m[3])+'日（'+WEEKDAY_JP_[d.getDay()]+'）';
}

// 3つの固定フォーマット(成約報告・1週間前共有・前日共有)。①ヒアリングシート・
// ③利用確認書の入力内容から分かる範囲だけ自動反映し、それ以外は当日記入用の
// プレースホルダのまま残す(依頼原文の文言をそのまま維持)。GPCMボードと共通仕様。
// timerange型の値("開始～終了")を{start,end}に分解する。未入力ならnull。
function parseTimeRangeStr_(v){
  if(!v||v.indexOf('～')<0)return null;
  const p=v.split('～');
  return {start:p[0]||'',end:p[1]||''};
}
// "HH:MM"からmins分だけ前の時刻を返す(日跨ぎは翌日側に繰り上げない単純計算)。
function subtractMinutes_(hhmm,mins){
  const m=hhmm&&hhmm.match(/^(\d{1,2}):(\d{2})$/);if(!m)return '';
  let total=(+m[1])*60+(+m[2])-mins;if(total<0)total+=24*60;
  return String(Math.floor(total/60)%24).padStart(2,'0')+':'+String(total%60).padStart(2,'0');
}
// 食事プラン・ドリンクタイプの提供時間帯から実際のケータリングスケジュールを算出する
// (両方入力されている場合は最も早い開始～最も遅い終了をまとめて使う)。
// LO(ラストオーダー)は終了時刻の15分前として自動計算する。未入力の項目は
// 「００：００」のプレースホルダのまま残す。成約報告・1週間前共有の両テンプレで共用。
function cateringSchedule_(){
  const mealR=parseTimeRangeStr_(q('食事プラン（提供時間帯）'));
  const drinkR=parseTimeRangeStr_(q('ドリンクタイプ（提供時間帯）'));
  const starts=[mealR&&mealR.start,drinkR&&drinkR.start].filter(Boolean).sort();
  const ends=[mealR&&mealR.end,drinkR&&drinkR.end].filter(Boolean).sort();
  const start=starts.length?starts[0]:'００：００';
  const end=ends.length?ends[ends.length-1]:'００：００';
  const lo=ends.length?subtractMinutes_(end,15):'００：００';
  return {start,end,lo};
}

function richToolbarHtml(){
  return '<button type="button" class="toolbtn sec" onmousedown="event.preventDefault()" onclick="document.execCommand(\'bold\')"><b>B</b> 太字</button>'+
    '<select onchange="if(this.value)applyRichColor_(this.value);this.selectedIndex=0">'+
    '<option value="">文字色…</option><option value="#111111">黒(既定)</option><option value="#dc2626">赤</option><option value="#2563eb">青</option><option value="#16a34a">緑</option></select>';
}
// 数字混じりの選択範囲がブラウザに自動でリンク化(<a>)されてしまい、
// execCommand('foreColor')が効かないケースがあるため、選択範囲を自前でspan化して文字色を適用する。
function unwrapAnchors_(node){
  const anchors=node.querySelectorAll?Array.from(node.querySelectorAll('a')):[];
  anchors.forEach(a=>{const parent=a.parentNode;while(a.firstChild)parent.insertBefore(a.firstChild,a);parent.removeChild(a);});
  return node;
}
function applyRichColor_(color){
  const sel=window.getSelection();
  if(!sel||sel.rangeCount===0||sel.isCollapsed)return;
  const range=sel.getRangeAt(0);
  const frag=range.extractContents();
  unwrapAnchors_(frag);
  const span=document.createElement('span');
  span.style.color=color;
  span.appendChild(frag);
  range.insertNode(span);
  sel.removeAllRanges();
}
function collectConfPayload_(variant){
  const b=activeBlock();
  const cf=ensureConf_(b);
  return {variant:variant,venueName:b.venueName||'',venueAddress:b.venueAddress||'',
    salesRep:q('営業担当'),attendant:cf.attendant,
    company:q('会社名'),client:q('担当者'),site:q('予約サイト'),
    useDate:q('日付'),useTime:q('時間'),headcount:q('来場人数'),
    summaryHtml:document.getElementById('seiyakuSummary').innerHTML,
    staffShareHtml:document.getElementById('staffShareEdit').innerHTML,
    standardFees:ensureStandardFees_(b),freeFees:ensureFreeFees_(b).filter(freeFeeOn_),
    maintenanceFee:computeMaintenanceFee_(b),
    preConfirmed:cf.preConfirmed,prePaid:cf.prePaid,balance:cf.balance,payDue:cf.payDue,
    receiptName:cf.receiptName,receiptAddress:cf.receiptAddress,
    prePayMethod:cf.prePayMethod,addPayMethod:cf.addPayMethod};
}
function makeConfPdf(variant){
  const d=collectConfPayload_(variant);

      if(box)box.innerHTML='作成しました：<a href="'+r.fileUrl+'" target="_blank" style="color:#60a5fa">'+esc(r.fileName)+'</a>';
      window.open(r.fileUrl,'_blank');
    })
    .withFailureHandler(function(e){ if(box)box.textContent='PDF作成エラー: '+e; })

}

function loadAllMasters_(cb){
  const hostEl=document.getElementById('hearing');
  if(!(typeof google!=='undefined'&&google.script&&google.script.run)){
    if(hostEl)hostEl.innerHTML='<div class="banner" style="color:#f87171">読込に失敗しました。ページを再読み込みしてください。</div>';
    cb();return;
  }
  let pending=4,finished=false;
  const finish=()=>{if(finished)return;finished=true;clearTimeout(timeoutTimer);cb();};
  const done=()=>{pending--;if(pending<=0)finish();};
  const timeoutTimer=setTimeout(function(){
    if(finished)return;
    console.error('[診断] マスタ取得が15秒以内に完了しませんでした(pending='+pending+')');
    if(hostEl)hostEl.innerHTML+='<div class="banner" style="color:#f87171">[診断] 15秒経過してもサーバーからの応答がありません(pending='+pending+'/4)。google.script.runのRPCがハングしている可能性があります。ページを再読み込みしても直らない場合はこの情報を報告してください。</div>';
    finish();
  },15000);
  google.script.run.withSuccessHandler(function(j){try{STANDARD_OPTIONS=JSON.parse(j)||[];}catch(e){STANDARD_OPTIONS=[];}done();})
    .withFailureHandler(function(err){console.warn('共通オプション取得失敗',err);STANDARD_OPTIONS=[];done();}).apiGetStandardOptions();
  google.script.run.withSuccessHandler(function(j){try{FAVORITE_VENUES=JSON.parse(j)||[];}catch(e){FAVORITE_VENUES=[];}done();})
    .withFailureHandler(function(err){console.warn('よく使う会場取得失敗',err);FAVORITE_VENUES=[];done();}).apiGetFavoriteVenues();
  google.script.run.withSuccessHandler(function(j){try{HEARING=JSON.parse(j)||[];}catch(e){HEARING=[];}done();})
    .withFailureHandler(function(err){console.warn('ヒアリング項目マスタ取得失敗',err);HEARING=[];done();}).apiGetFormSchema();
  google.script.run.withSuccessHandler(function(j){try{STAFF_TEMPLATE=(JSON.parse(j)||{}).body||'';}catch(e){STAFF_TEMPLATE='';}done();})
    .withFailureHandler(function(err){console.warn('共有事項テンプレ取得失敗',err);STAFF_TEMPLATE='';done();}).apiGetStaffTemplate();
}
loadAllMasters_(function(){
  if(window.INITIAL_CASE_ID){loadCaseById(window.INITIAL_CASE_ID);}
  else{renderAll();}
});
